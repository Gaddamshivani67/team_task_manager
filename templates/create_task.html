{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-8">

        <div class="card p-4">
            <h2 class="mb-4">Create New Task</h2>

            <form method="POST">

                <div class="mb-3">
                    <label>Task Title</label>
                    <input
                        type="text"
                        name="title"
                        class="form-control"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label>Description</label>
                    <textarea
                        name="description"
                        class="form-control"
                        rows="4"
                        required
                    ></textarea>
                </div>

                <div class="mb-3">
                    <label>Due Date</label>
                    <input
                        type="date"
                        name="due_date"
                        class="form-control"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label>Assign To (User ID)</label>
                    <input
                        type="number"
                        name="assigned_to"
                        class="form-control"
                        placeholder="Example: 1"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label>Project ID</label>
                    <input
                        type="number"
                        name="project_id"
                        class="form-control"
                        placeholder="Example: 1"
                        required
                    >
                </div>

                <button
                    type="submit"
                    class="btn btn-primary w-100"
                >
                    Create Task
                </button>

            </form>
        </div>

    </div>
</div>

{% endblock %}
